########## LDD arm on merged_bird.sqlite -- DeepEye-SQL with paper configs ##########
# Sampling budgets, temperature and thresholds follow the paper (Implementation
# Details, S4.1): "For each LLM sub-task (e.g., Direct Schema Linking), we set
# the sampling budget to 8 with a sampling temperature of 0.7", theta_val = 0.98
# similarity, theta_conf = 0.6, top-2 adjudication, top-5 values per TEXT column.
# The repo defaults had drifted to 12/16 with no ablation behind them.
#
# Arms:  ldd_arm_name = base | rap_opt1 | rap_opt2

[logger]
print_level = "INFO"

[run]
save_root = "workspace/runs"
exp_name = "ldd-bird-rap-opt1"
parallelism = 16
embedding_batch_size = 256
llm_timeout = 300
progress_log_interval = 50
checkpoint_interval = 20
default_llm_profile = "qwen3_coder_instruct"

[llm_profiles.qwen3_coder_instruct]
model = "Qwen3-Coder-30B-A3B-Instruct"
base_url = "your-llm-model-base-url"
api_key = "${LLM_API_KEY}"          # from the environment; never write keys here
max_tokens = 16384
temperature = 0.7
n_call_strategy = "single"
api_type = "openai"
# Raised from the shipped 65536. opt2 shows the reversed linker the matched
# cluster tables plus their views on top of the schema profile; 65536 is a repo
# default, not a paper number, and Qwen3-Coder-30B supports far more natively.
max_model_len = 131072
extra_body = { top_p = 0.8, top_k = 20, repetition_penalty = 1.05 }

[embedding]
api_type = "openai"
embedding_model_name_or_path = "Qwen3-Embedding-0.6B"
base_url = "your-embedding-model-base-url"
api_key = "${EMBEDDING_API_KEY}"    # from the environment; never write keys here

########## Dataset: LDD merged schema ##########
[dataset]
type = "ldd"
split = "bird"                 # bird | spider -- selects merged_<ds>.sqlite
root_path = "bird"             # dataset name; the LDD paths come from app/ldd/config.py
ldd_arm_name = "rap_opt1"      # base | rap_opt1 | rap_opt2
ldd_model_tag = "q3c"
sql_execution_timeout = 120
max_value_example_length = 100

[vector_database]
max_value_length = 100
lower_meta_data = true
build_backend = "local_index"

########## Few-shot: LDD history pool, top-3 ##########
[few_shot_index]
num_examples = 3               # our history is stronger than BIRD-train; paper never states K
question_weight = 0.6
sql_weight = 0.4
similarity_device = "cuda:0"
force_rebuild = false
llm_profile = "qwen3_coder_instruct"

[few_shot_index.preliminary_sql]
enabled = true
dc_sampling_budget = 8
skeleton_sampling_budget = 8
llm_profile = "qwen3_coder_instruct"

[value_retrieval]
max_values_per_column = 5
backend = "local_index"
local_index_device = "cuda:0"
llm_profile = "qwen3_coder_instruct"

[schema_linking]
direct_linking_sampling_budget = 8
reversed_linking_sampling_budget = 8
value_distance_threshold = 0.02   # paper theta_val = 0.98 similarity; code tests distance <
llm_profile = "qwen3_coder_instruct"

########## Stage 5.5: LDD +A/+P injection ##########
[apr_injection]
history_top_k = 3
max_join_paths = 0            # 0 = uncapped; every matched cluster path is shown

[sql_generation]
dc_sampling_budget = 8
skeleton_sampling_budget = 8
icl_sampling_budget = 8            # 3 generators x 8 = 24 candidates
llm_profile = "qwen3_coder_instruct"

[sql_revision]
checker_sampling_budget = 8
llm_profile = "qwen3_coder_instruct"

[sql_selection]
filter_top_k_sql = 2
evaluator_sampling_budget = 8
shortcut_consistency_score_threshold = 0.6
llm_profile = "qwen3_coder_instruct"

[llm_extractor]
max_retry = 5
